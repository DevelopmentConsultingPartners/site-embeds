    function platInfo(){for(var i=0;i<CONFIG.platforms.length;i++)if(CONFIG.platforms[i].id===S.plat)return CONFIG.platforms[i];return null;}
    function platSteps(){var p=platInfo();return p.steps.concat([['Check in each evening','Your agent works on the job you chose. Spend 10 minutes each evening reviewing its summary, and approve anything before it goes out.']]);}

    // Where should the agent live? Muse (free tokens) or an app they already use (no credits).
    function platform(){
      var c=h('div','af-card');c.appendChild(h('p','af-label',esc(CONFIG.platformQuestion)));
      var g=h('div','af-grid af-2');
      var m=h('button','af-choice');m.type='button';m.innerHTML='<span class="af-badge" aria-hidden="true">1</span><span><span class="af-h3" style="display:block">'+esc(CONFIG.newToAiTitle)+' <span class="af-heretag">Free tokens</span></span><span class="af-muted">'+esc(CONFIG.newToAiBody)+'</span></span>';
      m.addEventListener('click',function(){S.plat='Muse';S.platOther='';packet();});g.appendChild(m);
      var o=h('div','af-device');o.innerHTML='<p class="af-h3"><span class="af-badge" style="display:inline-flex;width:30px;height:30px;margin-right:8px;vertical-align:middle" aria-hidden="true">2</span>'+esc(CONFIG.ownAiTitle)+'</p>';o.appendChild(h('p','af-muted',esc(CONFIG.ownAiBody)));
      var chips=h('div','af-chips'),oth=h('div','af-hidden'),oi=h('input','af-input'),ob=btn('Continue','af-btn-primary',function(){var v=oi.value.trim();if(!v){oi.focus();return;}S.plat='Other';S.platOther=v;packet();});
      oi.type='text';oi.placeholder='Which AI app do you use?';oi.value=S.platOther||'';oth.appendChild(oi);ob.style.marginTop='8px';oth.appendChild(ob);
      CONFIG.platforms.forEach(function(p){var ch=h('button','af-chip',esc(p.id));ch.type='button';ch.setAttribute('aria-pressed',S.plat===p.id?'true':'false');
        ch.addEventListener('click',function(){if(p.id==='Other'){[].forEach.call(chips.children,function(x){x.setAttribute('aria-pressed','false');});ch.setAttribute('aria-pressed','true');oth.classList.remove('af-hidden');oi.focus();return;}S.plat=p.id;S.platOther='';packet();});chips.appendChild(ch);});
      o.appendChild(chips);o.appendChild(oth);g.appendChild(o);c.appendChild(g);
      var n=h('div','af-nav');n.appendChild(btn('Back','af-btn-ghost',function(){S.i=S.path.qs.length-1;question();}));c.appendChild(n);render([c]);
    }

    // Sign-up: name + email. Salesforce emails the active code and the agent message.
    function packet(){
      var a=S.a,c=h('div','af-card');
      c.appendChild(h('p','af-kicker','Your agent is ready'));c.appendChild(h('h3','af-h2',esc((a.name?a.name+', y':'Y')+'our agent’s first job: '+((a.taskCat&&a.taskCat!=='Something else')?a.taskCat:(a.task||''))+'.')));
      if(S.minor){
        c.appendChild(h('p','af-p',esc(CONFIG.minorMessage)));
        var pe=field(c,'Parent or guardian’s email','email'),te=field(c,'Teacher’s email (add more with commas)','text','',true);
      }else{
        c.appendChild(h('p','af-h3','Ready to send you your agent. Enter your email so we can get started.'));
        c.appendChild(h('p','af-p af-muted',SOFT()?(isMuse()?'Tap the button and your code and setup steps appear on the next screen.':'Tap the button and your setup steps for '+esc(platName())+' appear on the next screen.'):((isMuse()?'We’ll send your registration code and setup instructions to your email from ':'We’ll send your setup instructions for '+esc(platName())+' to your email from ')+esc(CONFIG.senderEmail)+'. Check it right after you tap the button for your next steps.')));
        var fn=field(c,'First name','text',a.name||''),ln=field(c,'Last name','text'),em=field(c,'Email','email'),
            co=coLabel()?field(c,coLabel(),'text',a.biz||'',true):null;
      }
      c.appendChild(h('p','af-label',S.minor?'What made you want an agent?':'What made you want an agent?'));c.lastChild.style.fontSize='16px';c.lastChild.style.marginTop='14px';
      var rchips=h('div','af-chips');S.reason=S.reason||'';reasons().forEach(function(r){var ch=h('button','af-chip',esc(r));ch.type='button';ch.setAttribute('aria-pressed',S.reason===r?'true':'false');ch.addEventListener('click',function(){S.reason=r;[].forEach.call(rchips.children,function(x){x.setAttribute('aria-pressed','false');});ch.setAttribute('aria-pressed','true');});rchips.appendChild(ch);});c.appendChild(rchips);
      var rmore=field(c,'Anything else we should know?','text','',true);
      if(!S.minor&&isMuse()&&CONFIG.spotsNote)c.appendChild(h('p','af-muted',esc(SOFT()?'Spots are limited and go first come, first served.':CONFIG.spotsNote)));
      var st=h('p','af-muted');st.setAttribute('role','status');c.appendChild(st);
      c.appendChild(h('p','af-muted',SOFT()?'We use your email to check that your agent started and follow up if you need help. Unsubscribe anytime.':'We use your email to send your code, check that your agent started, and follow up if you need help. Unsubscribe anytime.'));
      var n=h('div','af-nav');n.appendChild(btn('Back','af-btn-ghost',function(){if(S.minor){S.i=S.path.qs.length-1;question();}else platform();}));
      n.appendChild(btn(S.minor?'Send to my parent':(isMuse()?'Send me my agent':'Send me my setup steps'),'af-btn-primary',function(){
        if(!S.reason){st.textContent='Please pick what made you want an agent.';st.className='af-err';return;}
        var why=S.reason+(rmore.value.trim()?' | '+rmore.value.trim():'');
        var msg=message(),f={lead_source:CONFIG.sfLeadSource};
        if(S.minor){
          var p=pe.value.trim(),t=te.value.trim();
          if(!okEmail(p)){st.textContent='Please enter your parent or guardian’s email.';st.className='af-err';return;}
          if(t&&!t.split(',').every(function(x){return okEmail(x.trim());})){st.textContent='Please check the teacher email(s).';st.className='af-err';return;}
          f.first_name='';f.last_name='Parent of '+(a.name||'student');f.email=p;f.company=(a.name||'Student')+' (family)';
          f.description='AI Agent page | UNDER 18: code goes to parent only, after parent approval\nStudent first name: '+(a.name||'')+'\nTeacher email(s): '+(t||'none')+'\nWhy they signed up: '+why+'\n'+details()+'\n\nAgent message:\n'+sfMsg(msg);
          S.contact={email:p};
        }else{
          var e=em.value.trim();
          if(!fn.value.trim()){st.textContent='Please enter your first name.';st.className='af-err';return;}
          if(!okEmail(e)){st.textContent='Please enter a valid email so we can send your code.';st.className='af-err';return;}
          f.first_name=fn.value.trim();f.last_name=ln.value.trim()||'Unknown';f.email=e;f.company=(co&&co.value.trim())||(fn.value.trim()+' (individual)');
          f.description='AI Agent page | '+(SOFT()?'SOFT LAUNCH | ':'')+(isMuse()?(SOFT()?'Code shown on screen: '+CONFIG.softCode:'Code requested (Muse)'):'Own AI app | Platform: '+platName())+'\nWhy they signed up: '+why+'\n'+details()+'\n\nAgent message:\n'+sfMsg(msg);
          S.contact={first:f.first_name,last:ln.value.trim(),email:e,company:co?co.value.trim():''};
        }
        if(CONFIG.sfCampaignId){f.Campaign_ID=CONFIG.sfCampaignId;f.member_status='Responded';}
        if(CONFIG.sfMessageField)f[CONFIG.sfMessageField]=msg;
        if(CONFIG.sfPathField)f[CONFIG.sfPathField]=S.path.label;
        if(a.web){var wurl=/^https?:\/\//i.test(a.web)?a.web:'https://'+a.web;if(/facebook\.com|fb\.com/i.test(wurl)){if(CONFIG.sfFacebookField)f[CONFIG.sfFacebookField]=wurl;}else f.URL=wurl;}
        if(CONFIG.sfReasonField)f[CONFIG.sfReasonField]=why;
        if(CONFIG.sfJobCategoryField&&a.taskCat)f[CONFIG.sfJobCategoryField]=a.taskCat;
        if(CONFIG.sfPlatformField)f[CONFIG.sfPlatformField]=S.minor?'Muse':(isMuse()?'Muse':platName());
        if(CONFIG.sfEnabled)sendSF(f);
        else{location.href='mailto:'+CONFIG.helpEmail+'?subject='+encodeURIComponent('AI agent code request')+'&body='+encodeURIComponent(f.description+'\nEmail: '+f.email);}
        sent();
      }));
      c.appendChild(n);render([c]);
    }

    // After sign-up: check your email, get the app, and an on-screen copy of the message (without the code).
    function sent(){
      var out=[],c=h('div','af-card af-offer');
      if(S.minor){
        c.appendChild(h('p','af-ok','✓ We emailed your parent or guardian'));
        c.appendChild(h('p','af-p','We sent it to '+esc(S.contact.email)+' from '+esc(CONFIG.senderEmail)+'. Once they approve, they’ll get your code and the setup steps, and we’ll let your teacher know. Ask them to check their spam folder if they don’t see it.'));
        out.push(c);var n=h('div','af-nav');n.appendChild(btn('Start over','af-btn-ghost',home));out.push(n);render(out);return;}
      if(!isMuse()){var P=platInfo();
        if(SOFT()){c.appendChild(h('p','af-ok','✓ You’re in. Here are your setup steps'));c.appendChild(h('p','af-p','Start right now with the steps below. We’ll check in to see how your agent is doing.'));}
        else{c.appendChild(h('p','af-ok','✓ Check your email now for next steps'));
        c.appendChild(h('p','af-p','Your setup instructions for '+esc(platName())+' are on the way to '+esc(S.contact.email)+' from '+esc(CONFIG.senderEmail)+'. You can also start right now with the steps below.'));}
        var ol=h('ol','af-list');platSteps().forEach(function(x){var li=h('li');li.innerHTML='<strong>'+esc(x[0])+'.</strong> '+esc(x[1]);ol.appendChild(li);});c.appendChild(ol);
        var ol2=h('div','af-nav');ol2.style.justifyContent='flex-start';if(P.url){ol2.appendChild(link('Open '+platName(),'af-btn-primary',P.url));c.appendChild(ol2);}out.push(c);
        var mm=h('div','af-card');mm.appendChild(h('h3','af-h3','Your agent message'));var pk2=h('pre','af-packet af-hidden');pk2.textContent=message();var st2=h('p','af-muted');st2.setAttribute('role','status');
        var r2=h('div','af-nav');r2.style.justifyContent='flex-start';r2.appendChild(btn('Copy my agent message','af-btn-primary',function(){copy(message(),st2);}));r2.appendChild(btn('Show message','af-btn-ghost',function(){pk2.classList.toggle('af-hidden');}));
        mm.appendChild(r2);mm.appendChild(st2);mm.appendChild(pk2);out.push(mm);
        var n3=h('div','af-nav');n3.appendChild(btn('Wrong email? Go back','af-btn-ghost',packet));n3.appendChild(btn('Did it work?','af-btn-primary',check));out.push(n3);render(out);return;}
      if(SOFT()){
        c.appendChild(h('p','af-ok','✓ You’re in. Here’s your code'));
        var cb=h('div','af-codebox');cb.appendChild(h('span','af-code',esc(CONFIG.softCode)));var cst=h('p','af-muted');cst.setAttribute('role','status');
        cb.appendChild(btn('Copy code','af-btn-primary',function(){copy(CONFIG.softCode,cst);}));c.appendChild(cb);c.appendChild(cst);
        c.appendChild(h('p','af-p','Redeem it in '+esc(CONFIG.appName)+' under '+esc(CONFIG.redeemPath)+', within '+esc(CONFIG.redeemWindow)+' of creating your account. '+esc(CONFIG.appName)+' confirms your free tokens on that screen.'));
        var ul0=h('ol','af-list');['Get '+CONFIG.appName+' on your phone or computer and sign up.','Redeem your code ('+CONFIG.softCode+') in '+CONFIG.redeemPath+'.','Paste your agent message into a new chat and send it. Your agent replies with what it will do first.'].forEach(function(x){ul0.appendChild(h('li',null,esc(x)));});c.appendChild(ul0);out.push(c);
        out.push(getApp('Next: get '+CONFIG.appName));
      } else {
      c.appendChild(h('p','af-ok','✓ Check your email now for next steps'));
      c.appendChild(h('p','af-p','Your registration code and setup instructions are on the way to '+esc(S.contact.email)+' from '+esc(CONFIG.senderEmail)+'. Look for “'+esc(CONFIG.codeEmailSubject)+'.” If it isn’t there in a few minutes, check spam or promotions. If this round of spots is already full, the email will say you’re on the waitlist, and your code will follow as soon as a spot opens.'));
      var ul=h('ol','af-list');['Get '+CONFIG.appName+' on your phone or computer and sign up.','Redeem the code from the email in '+CONFIG.redeemPath+', within '+CONFIG.redeemWindow+' of signing up. '+CONFIG.appName+' confirms your free tokens there.','Paste your agent message into a new chat and send it. Your agent replies with what it will do first.'].forEach(function(x){ul.appendChild(h('li',null,esc(x)));});c.appendChild(ul);out.push(c);
      out.push(getApp('While you wait: get '+CONFIG.appName));
      }
      var m=h('div','af-card');m.appendChild(h('h3','af-h3','Your agent message'));
      m.appendChild(h('p','af-p af-muted',SOFT()?'Your agent’s instructions, written from your answers. You’ll paste this in step 3.':'It’s in your email too. Copy it here if that’s easier.'));
      var pk=h('pre','af-packet af-hidden');pk.textContent=message();var st=h('p','af-muted');st.setAttribute('role','status');
      var row=h('div','af-nav');row.style.justifyContent='flex-start';
      row.appendChild(btn('Copy my agent message','af-btn-ghost',function(){copy(message(),st);}));
      row.appendChild(btn('Show message','af-btn-ghost',function(){pk.classList.toggle('af-hidden');}));
      m.appendChild(row);m.appendChild(st);m.appendChild(pk);out.push(m);
      var n2=h('div','af-nav');n2.appendChild(btn('Wrong email? Go back','af-btn-ghost',packet));n2.appendChild(btn('Walk me through setup','af-btn-primary',function(){S.step=0;setup();}));out.push(n2);render(out);
    }

    function setup(){
      var s=CONFIG.steps[S.step],tot=CONFIG.steps.length;if(SOFT()&&CONFIG.softSteps&&CONFIG.softSteps[S.step])s=CONFIG.softSteps[S.step];var c=h('div','af-card');
      var pr=h('div','af-progress');pr.innerHTML='<span style="width:'+Math.round((S.step+1)/tot*100)+'%"></span>';c.appendChild(pr);
      c.appendChild(h('p','af-muted','Setup · Step '+(S.step+1)+' of '+tot));
      var row=h('div','af-step');row.appendChild(h('span','af-num',String(S.step+1)));var body=h('div');body.appendChild(h('p','af-h2',esc(s.title)));body.appendChild(h('p','af-p',app(esc(s.body))));row.appendChild(body);c.appendChild(row);
      if(S.step===0){var ga=getApp('Pick where you’ll use it');ga.style.margin='12px 0 0';ga.style.boxShadow='none';ga.style.padding='0';ga.style.border='0';c.appendChild(ga);}
      if(S.step===1&&SOFT()){var cb2=h('div','af-codebox');cb2.appendChild(h('span','af-code',esc(CONFIG.softCode)));var cs2=h('p','af-muted');cs2.setAttribute('role','status');cb2.appendChild(btn('Copy code','af-btn-primary',function(){copy(CONFIG.softCode,cs2);}));c.appendChild(cb2);c.appendChild(cs2);}
      if(S.step===2){
        var st=h('p','af-muted');st.setAttribute('role','status');var pk=h('pre','af-packet af-hidden');pk.textContent=message();
        var r=h('div','af-nav');r.style.justifyContent='flex-start';r.appendChild(btn('Copy my agent message','af-btn-primary',function(){copy(message(),st);}));r.appendChild(btn('Show message','af-btn-ghost',function(){pk.classList.toggle('af-hidden');}));c.appendChild(r);c.appendChild(st);c.appendChild(pk);}
      var tip=h('details','af-tip');tip.innerHTML='<summary>Stuck?</summary><p class="af-p" style="margin:8px 0 0">'+app(esc(s.tip))+'</p>';c.appendChild(tip);
      var n=h('div','af-nav');
      n.appendChild(btn('Back','af-btn-ghost',function(){if(S.step===0)sent();else{S.step--;setup();}}));
      n.appendChild(btn(S.step===tot-1?'Did it work?':'Next step','af-btn-primary',function(){if(S.step<tot-1){S.step++;setup();}else check();}));
      c.appendChild(n);render([c]);
    }

    function check(){
      var c=h('div','af-card');c.appendChild(h('p','af-label','Is your agent up and running?'));var g=h('div','af-grid af-2');
      g.appendChild(btn('Yes, it’s working','af-btn-primary',done));g.appendChild(btn('Not yet, I’m stuck','af-btn-ghost',stuck));c.appendChild(g);
      var n=h('div','af-nav');n.appendChild(btn('Back to the steps','af-btn-ghost',function(){if(isMuse()){S.step=CONFIG.steps.length-1;setup();}else sent();}));c.appendChild(n);render([c]);
    }

    function done(){
      var D=S.path.done,c=h('div','af-card af-offer');
      if(D){c.appendChild(h('p','af-ok','✓ '+esc(D.title)));c.appendChild(h('p','af-p',esc(D.body)));var a=h('a','af-btn af-btn-primary',esc(D.button));a.href=CONFIG.reviewUrl;a.target='_blank';a.rel='noopener';c.appendChild(a);
        var crm=['Salesforce','HubSpot','Jobber','ServiceTitan','Housecall Pro'].some(function(t){return S.tools.indexOf(t)>-1;});if(D.noCrm&&!crm){var nc=h('p','af-p af-muted',esc(D.noCrm));nc.style.marginTop='12px';c.appendChild(nc);}if(D.always){var al2=h('p','af-p af-muted',esc(D.always));al2.style.marginTop='12px';c.appendChild(al2);}if(D.manager&&S.a.manages==='Yes'){var mc=h('p','af-p af-muted',esc(D.manager));mc.style.marginTop='12px';c.appendChild(mc);}if(S.path.id==='parent'&&S.a.spouseEmail){var sp=h('p','af-p af-muted',(SOFT()?'We’ll reach out to ':'We’ve emailed ')+esc(S.a.spouseName||'your spouse or partner')+(SOFT()?' with their setup steps.':' their setup steps.'));sp.style.marginTop='12px';c.appendChild(sp);}}
      else{c.appendChild(h('p','af-ok','✓ '+esc(CONFIG.doneTitle)));c.appendChild(h('p','af-p',esc(CONFIG.doneBody)));var a=h('a','af-btn af-btn-primary','Book my free agent review');a.href=CONFIG.reviewUrl;a.target='_blank';a.rel='noopener';c.appendChild(a);}
      var r=h('div','af-card');r.appendChild(h('h3','af-h2','Earn more free tokens: share your invite code'));
      r.appendChild(h('p','af-p','Your '+esc(CONFIG.appName)+' account comes with its own invite code. Send it to us and we’ll add it to our list of member codes. When our own codes run out, we share member codes with the new people we set up. If someone redeems yours, you both get free tokens.'));
      r.appendChild(h('p','af-p af-muted','Find it in '+esc(CONFIG.appName)+' on the invite screen (look for “Invite friends” or “Copy referral link”). It’s 6 characters.'));
      var K=S.contact||{},rc=field(r,'Your invite code','text'),re=K.email?null:field(r,'Your email','email');rc.maxLength=12;rc.style.textTransform='uppercase';
      var rs=h('p','af-muted');rs.setAttribute('role','status');r.appendChild(rs);
      var rn=h('div','af-nav');rn.style.justifyContent='flex-start';rn.appendChild(btn('Send my code','af-btn-primary',function(){
        var code=rc.value.trim().toUpperCase().replace(/\s/g,''),e=K.email||(re?re.value.trim():'');
        if(!/^[A-Z0-9]{5,12}$/.test(code)){rs.textContent='Please enter the code exactly as it appears in the app.';rs.className='af-err';return;}
        if(!okEmail(e)){rs.textContent='Please enter your email so we can match your code to you.';rs.className='af-err';return;}
        var f={first_name:K.first||S.a.name||'',last_name:K.last||'Unknown',email:e,company:K.company||((K.first||S.a.name||'')+' (individual)'),lead_source:CONFIG.sfLeadSource,description:'AI Agent page | Muse invite code shared: '+code+'\n'+details()};
        if(CONFIG.sfReferralField)f[CONFIG.sfReferralField]=code;if(CONFIG.sfCampaignId){f.Campaign_ID=CONFIG.sfCampaignId;f.member_status='Responded';}
        if(CONFIG.sfEnabled)sendSF(f);else{location.href='mailto:'+CONFIG.helpEmail+'?subject='+encodeURIComponent('My Muse invite code')+'&body='+encodeURIComponent(f.description+'\nEmail: '+e);}
        rs.textContent='Thanks! We saved your code. If we share it and someone redeems it, you’ll both get free tokens.';rs.className='af-ok';
      }));r.appendChild(rn);
      var n=h('div','af-nav');n.appendChild(btn('Build another agent','af-btn-ghost',home));render(isMuse()?[c,r,n]:[c,n]);
    }

    function stuck(){
      var c=h('div','af-card');c.appendChild(h('h3','af-h2','We’ll help you finish'));c.appendChild(h('p','af-p','Tell us what happened and how to reach you. A real person from our team will follow up within one business day.'));
      c.appendChild(h('p','af-label','What happened?'));var chips=h('div','af-chips');var reason='';
      CONFIG.stuckReasons.filter(function(r){return !(SOFT()&&/email/i.test(r));}).forEach(function(r){var ch=h('button','af-chip',esc(r));ch.type='button';ch.setAttribute('aria-pressed','false');ch.addEventListener('click',function(){reason=r;[].forEach.call(chips.children,function(x){x.setAttribute('aria-pressed','false');});ch.setAttribute('aria-pressed','true');});chips.appendChild(ch);});c.appendChild(chips);
      var K=S.contact||{};var last=field(c,'Last name','text',K.last||''),em=field(c,'Email','email',K.email||''),co=coLabel()?field(c,coLabel(),'text',K.company||'',true):null;
      var st=h('p','af-muted');st.setAttribute('role','status');
      var n=h('div','af-nav');n.appendChild(btn('Back','af-btn-ghost',check));
      n.appendChild(btn('Send to our team','af-btn-primary',function(){
        var e=em.value.trim();if(!okEmail(e)){st.textContent='Please enter a valid email so we can reach you.';st.className='af-err';return;}
        var desc='AI Agent page | Platform: '+(isMuse()?'Muse':platName())+' | Path: '+S.path.label+' | Stuck: '+(reason||'not given')+'\nFirst job: '+(S.a.task||'')+(S.a.org?'\nContext: '+S.a.org:'')+(S.a.tools?'\nTools: '+S.a.tools:'')+'\nGoal: '+(S.a.goal||'');
        if(CONFIG.sfEnabled){sendSF({first_name:S.a.name||'',last_name:last.value.trim()||'Unknown',email:e,company:(co&&co.value.trim())||((S.a.name||'')+' (individual)'),lead_source:CONFIG.sfLeadSource,description:desc});st.textContent='Thanks. Our team will email you within one business day.';st.className='af-ok';}
        else{location.href='mailto:'+CONFIG.helpEmail+'?subject='+encodeURIComponent('Help setting up my AI agent')+'&body='+encodeURIComponent(desc+'\nEmail: '+e);}
      }));
      c.appendChild(st);c.appendChild(n);
      var a=h('a','af-btn af-btn-ghost','Or book a call now');a.href=CONFIG.bookingUrl;a.target='_blank';a.rel='noopener';a.style.marginTop='10px';c.appendChild(a);
      render([c]);
    }

    function sendSF(f){
      var name='afsf'+Math.random().toString(36).slice(2,8);var fr=document.createElement('iframe');fr.name=name;fr.style.display='none';fr.title='hidden';
      var fm=document.createElement('form');fm.method='POST';fm.action='https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8';fm.target=name;fm.style.display='none';
      f.oid=CONFIG.sfOrgId;Object.keys(f).forEach(function(k){var i=document.createElement('input');i.type='hidden';i.name=k;i.value=f[k];fm.appendChild(i);});
      // Kept outside the widget so re-rendering the screen can't cancel the submission; cleaned up after 60s.
      var box=document.body||root;box.appendChild(fr);box.appendChild(fm);fm.submit();
      setTimeout(function(){try{fm.parentNode.removeChild(fm);fr.parentNode.removeChild(fr);}catch(e){}},60000);
    }

    home();
  }
  function boot(){[].forEach.call(document.querySelectorAll('.dcp-agent-free'),function(r){if(!r.getAttribute('data-ready')){r.setAttribute('data-ready','1');init(r);}});}
  if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
})();
</script>
